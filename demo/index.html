<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>particle-globe: a tiny WebGL particle globe</title>
    <meta name="description" content="Land as glowing dots, floating particles, arcs between places, region focus and a morph to a flat map. Plain WebGL, no dependencies. Pick a preset, tune it, copy the code." />
    <meta name="theme-color" content="#f4f3f0" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://globe.mickydollimore.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="particle-globe" />
    <meta property="og:title" content="particle-globe: a tiny WebGL particle globe" />
    <meta property="og:description" content="Land as glowing dots, arcs between places, region focus and a flat map morph. Plain WebGL, no dependencies. Tune it and copy the code." />
    <meta property="og:url" content="https://globe.mickydollimore.com/" />
    <meta property="og:image" content="https://globe.mickydollimore.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The particle-globe customiser: a globe of gradient dots with arcs, and the settings panel." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="particle-globe: a tiny WebGL particle globe" />
    <meta name="twitter:description" content="Land as glowing dots, arcs between places, region focus and a flat map morph. Plain WebGL, no dependencies." />
    <meta name="twitter:image" content="https://globe.mickydollimore.com/og.png" />
    <link rel="stylesheet" href="./style.css" />
    <script>
      try {
        var t = localStorage.getItem("pg-theme")
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t
        var h = decodeURIComponent(location.hash.slice(1))
        if (h) {
          var s = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(h), function (c) { return c.charCodeAt(0) })))
          if (s.theme === "light" || s.theme === "dark") document.documentElement.dataset.theme = s.theme
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <h1>particle-globe</h1>
        <span class="meta">~14KB gzipped, no dependencies</span>
      </div>
      <nav class="links" aria-label="Project">
        <button id="copy-install" class="install" type="button" title="Copy install command"><code>npm i particle-globe</code></button>
        <a class="link" href="https://github.com/Dollimore/particle-globe">GitHub</a>
        <button id="theme" class="icon-btn" type="button" aria-label="Switch colour theme" title="Switch colour theme"></button>
      </nav>
    </header>

    <main class="layout">
      <section class="stage-wrap" aria-label="Globe preview">
        <div id="stage" class="stage"></div>
        <div class="stage-bar">
          <p class="hint">Drag to spin</p>
          <div id="projection" class="stage-seg"></div>
          <div id="map-centre" class="stage-centre" hidden></div>
        </div>
      </section>

      <aside class="panel" aria-label="Settings">
        <div class="panel-scroll" id="scroll">
          <div class="block">
            <div class="block-head">
              <h2 class="block-title">Presets</h2>
              <span id="modified" class="pill" hidden>Edited</span>
            </div>
            <div id="presets" class="presets"></div>
          </div>
          <div id="sections"></div>
        </div>
        <footer class="actions">
          <button id="copy-code" class="btn primary" type="button">Copy code</button>
          <button id="copy-link" class="btn" type="button">Share link</button>
          <button id="reset" class="btn ghost" type="button" title="Back to the preset's values">Reset</button>
        </footer>
      </aside>
    </main>

    <p id="toast" class="toast" role="status" aria-live="polite"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
